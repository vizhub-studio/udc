name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        id: install
      - name: Formatting
        id: format
        run: npm run format:check
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Type checking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Package tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:package
      - name: Example
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run example
      - name: Show formatting diff
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          npm run format
          git diff --no-ext-diff

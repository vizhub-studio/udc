name: Temporary PR14 formatter
on:
  push:
    branches:
      - feat/coordinate-coverage-pr2
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/coordinate-coverage-pr2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coordinate-coverage-pr2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run prettier
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/api.md docs/concepts.md docs/limitations.md docs/quickstart.md src/coverage.ts src/types.ts src/limits.ts src/index.ts test/coverage.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(udc): apply repository Prettier formatting to coverage PR"
            git push origin HEAD:feat/coordinate-coverage-pr2
          fi

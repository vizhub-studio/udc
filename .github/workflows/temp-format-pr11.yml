name: Temporary PR formatter
on:
  push:
    branches:
      - feat/explicit-outer-joins
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/explicit-outer-joins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/explicit-outer-joins
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prettier
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/api.md src/integrate-cubes.ts src/slice-cube.ts src/types.ts test/outer-joins.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository Prettier formatting"
            git push origin HEAD:feat/explicit-outer-joins
          fi
